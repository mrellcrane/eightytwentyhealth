# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
# The .xcodeproj is gitignored; this file is the source of truth.
name: EightyTwenty

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  EightyTwentyCore:
    path: Packages/EightyTwentyCore
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.29.2

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  EightyTwenty:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
          - Info.plist
    dependencies:
      - package: EightyTwentyCore
      - package: Sentry
        product: Sentry
      - sdk: HealthKit.framework
    settings:
      base:
        PRODUCT_NAME: EightyTwenty
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).eightytwenty
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

schemes:
  EightyTwenty:
    build:
      targets:
        EightyTwenty: all
    run:
      config: Debug
    archive:
      config: Release
