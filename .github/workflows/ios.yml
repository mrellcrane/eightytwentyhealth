# Builds the app on GitHub's Macs so nobody needs Xcode locally.
#
# Without App Store Connect secrets: compile check only (unsigned Simulator build).
# With them: signed archive, uploaded to TestFlight. Install from the TestFlight app.
#
# Secrets (repo Settings > Secrets and variables > Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   App Store Connect API key (Admin role), .p8 file contents
#   APPLE_TEAM_ID                           10-character team ID
#   OURA_CLIENT_ID, OURA_CLIENT_SECRET      from cloud.ouraring.com/oauth/applications
#   SENTRY_DSN                              optional; Sentry project DSN, sends app logs to sentry.io
#   SENTRY_AUTH_TOKEN                       optional; Sentry organization auth token, uploads dSYMs so
#                                           crashes and hangs show function names and lines
name: iOS

on:
  push:
    branches: ["main", "claude/**"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
      OURA_CLIENT_SECRET: ${{ secrets.OURA_CLIENT_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Core package tests
        run: swift test --package-path Packages/EightyTwentyCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Decide mode
        id: mode
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "testflight=true" >> "$GITHUB_OUTPUT"
            echo "App Store Connect secrets found: archiving for TestFlight."
          else
            echo "testflight=false" >> "$GITHUB_OUTPUT"
            echo "No App Store Connect secrets: compile check only."
          fi

      - name: Compile check (iOS Simulator, unsigned)
        if: steps.mode.outputs.testflight != 'true'
        run: |
          xcodebuild build \
            -project EightyTwenty.xcodeproj \
            -scheme EightyTwenty \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || true
          echo "::group::Errors and warnings"
          grep -E "(error|warning): " build.log | sort -u || true
          echo "::endgroup::"
          tail -5 build.log
          grep -q "BUILD SUCCEEDED" build.log

      # Each run is a fresh Mac with no signing identity, so automatic signing makes a new
      # "Apple Development" certificate through the API key every time, and Apple caps how
      # many an account can hold. Earlier runs' certificates are dead weight (their private
      # keys left with those machines), so revoke them first. Only certificates named
      # "Created via API" are touched; logs show counts only, since this repo is public.
      - name: Revoke development certificates left by earlier runs
        if: steps.mode.outputs.testflight == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          export KEY_PATH="$RUNNER_TEMP/cleanup_key.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          ruby <<'RUBY'
          require "json"
          require "net/http"
          require "openssl"

          b64 = ->(s) { [s].pack("m0").tr("+/", "-_").delete("=") }
          key = OpenSSL::PKey::EC.new(File.read(ENV.fetch("KEY_PATH")))
          now = Time.now.to_i
          header = b64.(JSON.generate(alg: "ES256", kid: ENV.fetch("ASC_KEY_ID"), typ: "JWT"))
          claims = b64.(JSON.generate(iss: ENV.fetch("ASC_ISSUER_ID"), iat: now, exp: now + 600, aud: "appstoreconnect-v1"))
          der = key.sign(OpenSSL::Digest::SHA256.new, "#{header}.#{claims}")
          # JWT wants the raw 64-byte r||s, not OpenSSL's DER.
          r, s = OpenSSL::ASN1.decode(der).value.map { |n| n.value.to_s(2).rjust(32, "\x00") }
          jwt = "#{header}.#{claims}.#{b64.(r + s)}"

          http = Net::HTTP.new("api.appstoreconnect.apple.com", 443)
          http.use_ssl = true
          list = Net::HTTP::Get.new("/v1/certificates?filter%5BcertificateType%5D=DEVELOPMENT,IOS_DEVELOPMENT&limit=200")
          list["Authorization"] = "Bearer #{jwt}"
          response = http.request(list)
          abort "Listing certificates failed: HTTP #{response.code}" unless response.code == "200"

          certificates = JSON.parse(response.body).fetch("data")
          stale = certificates.select do |c|
            attributes = c.fetch("attributes")
            [attributes["name"], attributes["displayName"]].compact.any? { |n| n.include?("Created via API") }
          end
          revoked = stale.count do |c|
            delete = Net::HTTP::Delete.new("/v1/certificates/#{c.fetch("id")}")
            delete["Authorization"] = "Bearer #{jwt}"
            http.request(delete).code == "204"
          end
          puts "Development certificates: #{certificates.size}. Revoked #{revoked} of #{stale.size} left by earlier CI runs."
          RUBY
          rm -f "$KEY_PATH"

      - name: Archive and upload to TestFlight
        if: steps.mode.outputs.testflight == 'true'
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"

          cat > Config/Secrets.xcconfig <<EOF
          DEVELOPMENT_TEAM = $APPLE_TEAM_ID
          OURA_CLIENT_ID = $OURA_CLIENT_ID
          OURA_CLIENT_SECRET = $OURA_CLIENT_SECRET
          SENTRY_DSN = ${SENTRY_DSN#https://}
          EOF

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict>
          </plist>
          EOF

          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))

          if ! xcodebuild archive \
                -project EightyTwenty.xcodeproj \
                -scheme EightyTwenty \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -archivePath "$RUNNER_TEMP/EightyTwenty.xcarchive" \
                CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
                "${AUTH[@]}" > archive.log 2>&1; then
            grep -E "error" archive.log | sort -u || true
            tail -40 archive.log
            exit 1
          fi

          if ! xcodebuild -exportArchive \
                -archivePath "$RUNNER_TEMP/EightyTwenty.xcarchive" \
                -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
                -exportPath "$RUNNER_TEMP/export" \
                "${AUTH[@]}" > export.log 2>&1; then
            grep -iE "error" export.log | sort -u || true
            tail -40 export.log
            exit 1
          fi

          rm -f "$KEY_PATH"
          echo "Uploaded build $BUILD_NUMBER. It shows up in TestFlight after Apple finishes processing (usually 5 to 15 minutes)."

      # Runs after the TestFlight upload, so a failure here can't keep a build off TestFlight.
      - name: Upload dSYMs to Sentry
        if: steps.mode.outputs.testflight == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: apple-ios
        run: |
          set -euo pipefail
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::notice::No SENTRY_AUTH_TOKEN secret: skipping dSYM upload, so Sentry stack traces stay unsymbolicated."
            exit 0
          fi
          DSYMS="$RUNNER_TEMP/EightyTwenty.xcarchive/dSYMs"
          ls "$DSYMS"
          brew install getsentry/tools/sentry-cli
          sentry-cli debug-files upload --include-sources "$DSYMS"
